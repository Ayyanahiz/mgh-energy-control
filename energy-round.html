<style>
/* Layout: phone-first walk-round tool. Sticky header holds date, the five daily checks and floor tabs; body is the active check, the report, or history. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#18221f; --muted:#5d6a66; --line:#d9ddd9;
  --brass:#9a6b1f; --brass-soft:#f4ead8; --teal:#1f4b47; --teal-soft:#e2ecea;
  --off:#2d7a4b; --off-soft:#e1f1e6; --on:#b45d00; --on-soft:#fdebd3; --bad:#b3261e; --bad-soft:#fbe3e1;
  --occ:#4b5a8c; --occ-soft:#e6e9f5;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --panel:#19221f; --ink:#e6ebe8; --muted:#97a6a1; --line:#2c3834;
  --brass:#d9a85a; --brass-soft:#33291a; --teal:#8cc4bd; --teal-soft:#1d2e2b;
  --off:#6cc690; --off-soft:#15301f; --on:#f0a24a; --on-soft:#3a2810; --bad:#f2847a; --bad-soft:#3d1a17;
  --occ:#a5b2e6; --occ-soft:#20253a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --panel:#19221f; --ink:#e6ebe8; --muted:#97a6a1; --line:#2c3834;
  --brass:#d9a85a; --brass-soft:#33291a; --teal:#8cc4bd; --teal-soft:#1d2e2b;
  --off:#6cc690; --off-soft:#15301f; --on:#f0a24a; --on-soft:#3a2810; --bad:#f2847a; --bad-soft:#3d1a17;
  --occ:#a5b2e6; --occ-soft:#20253a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px 10px;display:grid;gap:10px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.brand h1 small{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
input[type=date]{width:auto}
input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;margin:2px 0 0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button,.btn{font:inherit;cursor:pointer;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary,.btn.primary{background:var(--teal);color:var(--panel);border-color:var(--teal);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 14px}
.tiles div{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.tiles span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tiles b{display:block;font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}
.tiles small{color:var(--muted);font-size:12px}
.pv{font-size:12px;font-weight:400;color:var(--muted);margin-top:4px;line-height:1.5}
.pv b{font-family:var(--mono);font-weight:600;color:var(--ink);font-size:11px}
.pv .pill{font-size:10px;padding:1px 6px}
.pill.occ{background:var(--occ-soft);color:var(--occ)}
.ver{grid-column:1/-1;display:grid;gap:8px;padding:8px;border-radius:6px;background:var(--teal-soft)}
.ver.missing{background:var(--bad-soft);outline:1px solid var(--bad)}
.ver .vq{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;font-weight:600}
.ver .vq .muted{font-weight:400}
.ver label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:grid;gap:4px}
.ver .who{font-size:12px;color:var(--bad);font-weight:600}
button.cf{font-size:12px;padding:6px 9px;color:var(--teal);border-color:var(--teal)}
.tile.pvon{border:2px dashed var(--on)} .tile.att{outline:2px solid var(--bad)}
.mcalc{font-size:13px;color:var(--muted)} .mcalc b{font-family:var(--mono);color:var(--ink)} .mcalc.warn{color:var(--bad)}
svg.chart{display:block;width:100%;min-width:560px;height:auto}
svg.chart .ax{fill:var(--muted);font:11px var(--mono)} svg.chart .gl{stroke:var(--line);stroke-width:1}
svg.chart .bar{fill:var(--teal)} svg.chart .bar.avg{fill:var(--teal);opacity:.4} svg.chart .bar:hover{opacity:.75}
details.panel summary{font-size:15px}
.step{display:grid;gap:1px;text-align:left;padding:6px 8px;border-radius:6px;min-width:0}
.step b{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .tm{font-family:var(--mono);font-size:11px;color:var(--muted)}
.step .ss{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step.prog .ss{color:var(--on)} .step.signed .ss{color:var(--off)}
.step[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.step.signed{background:var(--off-soft)}
.step .fl{color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{flex:0 0 auto;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tab .c{font-family:var(--mono);font-size:11px;opacity:.75}
.tab.done .c{color:var(--off);opacity:1}
.tab[aria-selected="true"].done .c{color:inherit}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.strip{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.strip b{color:var(--ink);font-weight:600}
.strip .n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.notice{margin-top:14px;font-size:13px;padding:9px 12px;border-radius:6px;background:var(--brass-soft);color:var(--ink)}
.notice.bad{background:var(--bad-soft)}
.floorhead{margin:22px 0 8px}
.floorhead h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.floorhead .lvl{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.floorhead p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:65ch}
.zone{margin-top:18px}
.zonehead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:2px solid var(--ink)}
.zonehead h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.zonehead .zn{font-size:12px;color:var(--muted);font-weight:500;display:block;margin-top:2px}
.zonehead .k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.zone.priority{background:var(--brass-soft);border:1px solid var(--brass);border-radius:8px;padding:4px 12px 10px}
.zone.priority .zonehead{border-color:var(--brass)}
.flag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;background:var(--brass);color:var(--panel);padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:2px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.row .nm{font-weight:600;min-width:0}
.row .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.row .tm{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px;font-weight:400}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 7px}
.seg button{border:0;border-left:1px solid var(--line);border-radius:0;padding:7px 10px;font-size:13px;font-weight:600;min-width:46px;justify-content:center}
.seg button[aria-pressed="true"].o{background:var(--off-soft);color:var(--off)}
.seg button[aria-pressed="true"].n{background:var(--on-soft);color:var(--on)}
.why{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px;padding:8px;border-radius:6px;background:var(--on-soft)}
.why.missing{background:var(--bad-soft);outline:1px solid var(--bad)}
.why label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:grid;gap:4px}
.why .who{grid-column:1/-1;font-size:12px;color:var(--bad);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-top:10px}
.tile{padding:8px 0;font-family:var(--mono);font-size:13px;font-weight:600;border-radius:6px;justify-content:center;flex-direction:column;gap:0;font-variant-numeric:tabular-nums}
.tile.ok{background:var(--off-soft);color:var(--off);border-color:var(--off)}
.tile.on{background:var(--on-soft);color:var(--on);border-color:var(--on)}
.tile.missing{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.tile.occ{background:var(--occ-soft);color:var(--occ);border-color:var(--occ)}
.tile[aria-current="true"]{outline:3px solid var(--ink);outline-offset:1px}
.tile small{display:block;font-size:9px;letter-spacing:.06em;font-weight:500;opacity:.8}
.actbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding:8px;border:1px dashed var(--line);border-radius:6px;font-size:13px;color:var(--muted)}
.actbar .sel{font-family:var(--mono);font-weight:600;color:var(--ink);margin-right:4px}
.actbar button.ok{color:var(--off)} .actbar button.on{color:var(--on)} .actbar button.occ{color:var(--occ)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:16px}
.panel h3{margin:0 0 10px;font-size:16px}
.panel h4{margin:14px 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.decl{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:12px}
.blockers{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--bad)}
.tw{overflow-x:auto;margin-top:6px}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.t th,table.t td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
table.t td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--off-soft);color:var(--off)} .pill.prog{background:var(--on-soft);color:var(--on)} .pill.no{background:var(--line);color:var(--muted)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.share{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
pre.report{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:280px;overflow:auto;margin:10px 0 0}
.guide{font-size:14px;margin:0;padding-left:20px;max-width:70ch}
.guide li{margin:6px 0}
.guide b{font-weight:700}
.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:4px 0 14px}
.sched div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.sched b{display:block;font-family:var(--mono);font-size:16px}
.muted{color:var(--muted)}
footer.act{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
footer.act .wrap{padding-block:10px;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
footer.act .st{font-size:12px;color:var(--muted)}
@media (max-width:620px){
  .steps{grid-template-columns:repeat(6,minmax(76px,1fr));overflow-x:auto}
  .row{grid-template-columns:1fr}
  .ctrls{justify-content:flex-start}
  .why{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>

</footer>

// state: "" unrecorded | "partial" | "off" | "occ" | "on"
function state(a,it){
  if(!it||it.cleared) return "";
  if(a.room){ if(it.s==="occ")return "occ"; if(it.s==="ok")return "off"; if(it.s==="on")return (it.l==="on"||it.a==="on")?"on":"off"; return ""; }
  if(!it.l||(a.ac&&!it.a)) return "partial";
  return (it.l==="on"||it.a==="on")?"on":"off";
}
function recorded(s){return s==="off"||s==="on"||s==="occ"}
function onDesc(a,it){return [it.l==="on"?"Lights":"",it.a==="on"?(a.n.indexOf("Sauna")>-1?"Heater":"AC"):""].filter(Boolean).join(" + ")||"ON"}
function items(cid){return C[cid].data.items||{}}
function stats(cid,ids){
  ids=ids||ORDER;const its=items(cid);
  const s={total:ids.length,rec:0,on:0,caught:0,unres:0,inuse:0,missing:0,occ:0,ver:0,vt:0,vf:0,vpend:0,vnote:0};
  ids.forEach(a=>{const it=its[a.id];const st=state(a,it);
    const vv=verdict(cid,a);if(vv!==undefined){s.ver++;if(vv==="true")s.vt++;else if(vv==="false"){s.vf++;if(!(it&&it.vn))s.vnote++}else if(prevItem(cid,a).s==="on")s.vpend++}
    if(recorded(st))s.rec++; if(st==="occ")s.occ++;
    if(st==="on"){s.on++; if(!it.r)s.missing++; else if(it.r===R_CAUGHT)s.caught++; else if(it.r===R_UNRES)s.unres++; else s.inuse++;}});
  return s;
}
function floorIds(f){return f.zones.flatMap(z=>z.ids)}
function floorTimes(cid,f){
  const its=items(cid);const ts=floorIds(f).map(a=>its[a.id]).filter(it=>it&&!it.cleared&&it.t0).map(it=>it.t0).sort((x,y)=>x-y);
  if(!ts.length)return null;
  const span=(ts[ts.length-1]-ts[0])/1000;const avg=ts.length>1?span/(ts.length-1):null;
  return {first:ts[0],last:ts[ts.length-1],n:ts.length,avg,fast:ts.length>=6&&avg!==null&&avg<8};
}
function flags(cid){
  const c=CK[cid],d=C[cid].data,out=[];
  if(d.startedAt){
    const diff=Math.round((d.startedAt-schedMs(c))/60000);
    if(Math.abs(diff)>30) out.push(`Started ${Math.abs(diff)} min ${diff>0?"late":"early"} (scheduled ${c.sched}, started ${hm(d.startedAt)})`);
    if(c.prev&&c.layer==="Security"){const pd=C[c.prev].data;
      if(!pd.startedAt) out.push(`Started before ${CK[c.prev].round} Engineering had started`);
      else if(d.startedAt-pd.startedAt<30*60000) out.push(`Started ${Math.max(0,Math.round((d.startedAt-pd.startedAt)/60000))} min after Engineering (rule: 30 min after)`);}
  }
  FLOORS.forEach(f=>{const t=floorTimes(cid,f);if(t&&t.fast)out.push(`${f.name}: ${t.n} areas recorded in ${Math.round((t.last-t.first)/1000)} s (avg ${t.avg.toFixed(1)} s per area). Verify physical visit.`)});
  if(d.startedAt&&!d.signedAt) out.push("Not signed off");
  return out;
}
function vsOf(cid){const c=CK[cid];return c.vs?c.vs.find(p=>C[p].data.startedAt)||null:null}
function shownOf(cid){return (CK[cid].show||[]).filter(p=>C[p].data.startedAt)}
function effState(a,it){const s=state(a,it);return s==="on"&&it.r===R_CAUGHT?"off":s}
function prevItem(cid,a){const p=vsOf(cid);if(!p)return null;const it=items(p)[a.id];const s=effState(a,it);return recorded(s)?{p,it,s}:null}
function descr(a,it){const s=state(a,it);if(s==="on"&&it.r===R_CAUGHT)return onDesc(a,it)+" found ON, switched OFF";return s==="off"?"All OFF":s==="occ"?"Occupied":s==="on"?onDesc(a,it)+" ON":s==="partial"?"Incomplete":"Not recorded"}
function verdict(cid,a){const pv=prevItem(cid,a);if(!pv)return undefined;const it=items(cid)[a.id];const own=effState(a,it);
  if(pv.s==="on")return it&&!it.cleared&&it.v?it.v:null;
  if(!recorded(own))return null;return own===pv.s?"true":"false"}
function discrepancies(){
  const out=[];
  CHECKS.forEach(c=>{const p=vsOf(c.id);if(!p||!C[c.id].data.startedAt)return;
    ORDER.forEach(a=>{if(verdict(c.id,a)==="false")out.push({a,p,q:c.id,type:c.change?"Changed":"False",pIt:items(p)[a.id],pDesc:descr(a,items(p)[a.id]),qIt:items(c.id)[a.id]})})});

}

function enqueue(key,fn){pending++;setSave("Saving…");
  queues[key]=(queues[key]||Promise.resolve()).then(fn).then(()=>{failed=false},e=>{failed=true;
    setSave(e&&e.code==="quota_exceeded"?"Storage full. Tell Engineering.":e&&e.code==="invalid_argument"?"Not saved: you need Contributor access to this page.":"Not saved. Check the connection and try again.")})

let deferred=false;
function subscribe(){
  unsubs.forEach(u=>u());unsubs=[];

  mread={exists:false,data:blankRead()};prevRead={};mdraft={};meterEdit=false;
  if(mode!=="db"){
    CHECKS.forEach(c=>{try{const v=localStorage.getItem(lsKey(c.id));if(v){C[c.id].data=Object.assign(blank(c.id),JSON.parse(v));C[c.id].exists=true}}catch(e){}});
    const cfg=lsGet("config/meters");meters=(cfg&&cfg.list)||[];
    const rd=lsGet("meters/"+date);if(rd)mread={exists:true,data:Object.assign(blankRead(),rd)};
    pickActive();render();loadPrev();return;
  }

  unsubs.push(db.doc("config/meters").onSnapshot(s=>{meters=(s.exists&&s.data().list)||[];loadPrev()},()=>{}));
  unsubs.push(db.doc("meters/"+date).onSnapshot(s=>{mread={exists:s.exists,data:s.exists?Object.assign(blankRead(),s.data(),{readings:Object.assign({},s.data().readings||{})}):blankRead()};
    const ae=document.activeElement;if(ae&&ae.dataset&&(ae.dataset.mread!==undefined||ae.dataset.staff!==undefined)){deferred=true;return}render()},()=>{}));
  CHECKS.forEach(c=>{
    unsubs.push(db.doc("rounds/"+date+"/checks/"+c.id).onSnapshot(snap=>{
      C[c.id].exists=snap.exists;
      C[c.id].data=snap.exists?Object.assign(blank(c.id),snap.data(),{items:Object.assign({},snap.data().items||{})}):blank(c.id);

      if(ae&&ae.dataset&&(ae.dataset.note!==undefined||ae.dataset.vnote!==undefined||ae.dataset.remarks!==undefined||ae.dataset.staff!==undefined)){deferred=true;return}

    },()=>setSave("Live sync stopped. Reload the page.")));
  });
}

function pickActive(){
  const now=Date.now(),isToday=date===today();

    const next=CHECKS.find(c=>checkStatus(c.id)==="no"&&schedMs(c)-30*60000<=now&&CHECKS.indexOf(c)>=CHECKS.indexOf(best));

    return `<div class="pv"><b>${esc(CK[p].short)} ${hm(it.t)}</b> ${pillFor(a,it)}${st==="on"&&it.r&&it.r!==R_CAUGHT?` ${esc(it.r)}`:""}${it.n?` · “${esc(it.n)}”`:""}${vv==="true"?` · <span style="color:var(--off)">confirmed true</span>`:vv==="false"?` · <span style="color:var(--bad)">${CK[p].change?"changed":"marked false"}</span>`:""}${it.vn?` · ${esc(it.vn)}`:""}</div>`}).join("");

function vseg(id,val,dis){return `<div class="seg" role="group" aria-label="Previous record"><button class="o" data-verdict="${id}" data-v="true" aria-pressed="${val==="true"}"${dis}>True</button><button class="n" data-verdict="${id}" data-v="false" aria-pressed="${val==="false"}"${dis}>False</button></div>`}
function verBlock(a,it,dis){

function confirmBtn(a,it,dis){const pv=prevItem(active,a);if(!pv||dis||recorded(state(a,it)))return "";return `<button class="cf" data-confirm="${a.id}">Confirm as recorded</button>`}

function roomZone(f,z,dis){
  const key=active+f.id+z.name;const sel=selTile[key];const its=items(active);
  const tiles=z.ids.map(a=>{const it=its[a.id];const s=state(a,it);const pv=prevItem(active,a);const vv=verdict(active,a);
    const cls=s==="on"?(it.r?"on":"missing"):s==="off"?"ok":s;
    const att=vv===null&&pv&&pv.s==="on"||vv==="false"&&!(it&&it.vn);
    const sub=s==="off"?"OFF":s==="occ"?"OCC":s==="on"?"ON":pv?"was "+(pv.s==="on"?"ON":pv.s==="occ"?"OCC":"OFF"):"&nbsp;";
    return `<button class="tile ${cls}${!s&&pv&&pv.s==="on"?" pvon":""}${att&&s?" att":""}" data-tile="${a.id}" data-key="${esc(key)}" aria-current="${sel===a.id}" aria-label="${esc(a.full)}"${dis}>${esc(a.n)}<small>${sub}</small></button>`}).join("");
  const sa=sel&&ALL[sel];const sit=sa?(its[sa.id]||{}):{};
  const bar=dis?"":sa?`<div class="actbar" style="display:grid;gap:6px"><div><span class="sel">${esc(sa.full)}</span>${prevHtml(sa)}</div><div style="display:flex;gap:6px;flex-wrap:wrap">
     ${confirmBtn(sa,sit.cleared?{}:sit,dis)}
     <button class="ok" data-tact="ok" data-id="${sa.id}" data-key="${esc(key)}">All OFF ✓</button>
     <button class="on" data-tact="on" data-id="${sa.id}" data-key="${esc(key)}">Found ON</button>
     <button class="occ" data-tact="occ" data-id="${sa.id}" data-key="${esc(key)}">Occupied</button>
     <button data-tact="clear" data-id="${sa.id}" data-key="${esc(key)}">Clear</button></div></div>`
   :`<div class="actbar">Tap each ${esc(z.ids[0].label.toLowerCase())} as you check it.${shownOf(active).length?" Dashed orange = recorded ON in the previous check: reconfirm it.":""}</div>`;
  const ons=z.ids.filter(a=>{const st=state(a,its[a.id]);const pv=prevItem(active,a);const vv=verdict(active,a);return st==="on"||(pv&&pv.s==="on")||vv==="false"});
  const list=ons.map(a=>{const raw=its[a.id]||{};const it=raw.cleared?{}:raw;const st=state(a,it);
    return `<div class="row"><div class="nm">${esc(a.full)}${it.t?`<span class="tm">${hm(it.t)}</span>`:""}${prevHtml(a)}</div>
      <div class="ctrls">${st==="on"?seg(a.id,"l","Lights",it.l,dis)+seg(a.id,"a","AC",it.a,dis):recorded(st)?pillFor(a,it):'<span class="muted" style="font-size:12px">Tap the room above to record it</span>'}</div>
      ${verBlock(a,it,dis)}${st==="on"?reasonBlock(a,it,dis):""}</div>`}).join("");
  return `<div class="grid">${tiles}</div>${bar}${list}
   <div class="legend"><span><i style="background:var(--off)"></i>All OFF</span><span><i style="background:var(--on)"></i>Found ON</span><span><i style="background:var(--occ)"></i>Occupied</span><span><i style="background:var(--bad)"></i>Needs a reason or answer</span>${shownOf(active).length?'<span><i style="border:1px dashed var(--on)"></i>Was ON: reconfirm</span>':""}</div>`;
}
function renderStart(){
  const c=CK[active];const d=C[active].data;
  let saved={};try{saved=JSON.parse(localStorage.getItem(LSK+"staff:"+c.layer)||"{}")}catch(e){}
  const diff=Math.round((Date.now()-schedMs(c))/60000);
  const warn=[];
  if(date!==today()) warn.push(`You are looking at ${date}, not today.`);
  else if(Math.abs(diff)>30) warn.push(`Scheduled for ${c.sched}. Starting now will be flagged as ${Math.abs(diff)} min ${diff>0?"late":"early"}.`);
  if(c.layer==="Security"){const pd=C[c.prev].data;
    if(!pd.startedAt) warn.push("Engineering has not started this round yet. Security starts 30 minutes after Engineering.");
    else if(Date.now()-pd.startedAt<30*60000) warn.push(`Engineering started at ${hm(pd.startedAt)}. Security should start from ${hm(pd.startedAt+30*60000)}.`);}
  if(c.vs&&c.layer!=="Security"&&!vsOf(active))warn.push(`${CK[c.vs[c.vs.length-1]].round} has not been checked yet, so there is no previous record to verify.`);
  else if(c.vs&&vsOf(active)&&!C[vsOf(active)].data.signedAt)warn.push(`${CK[vsOf(active)].short} has not signed off yet. You will see their record as it is now.`);
  main.innerHTML=`<div class="floorhead"><h2>${esc(c.round)} · ${esc(c.layer)} <span class="lvl">${c.sched}</span></h2><p>${esc(c.task)}</p></div>
   ${warn.map(w=>`<div class="notice">${esc(w)}</div>`).join("")}
   <div class="panel"><h3>Checker details</h3>
    <div class="form">
      <label>Full name<input type="text" id="stName" data-staff value="${esc(d.staffName||saved.name||"")}" autocomplete="name" placeholder="${esc(c.who)}"></label>
      <label>Staff ID<input type="text" id="stId" data-staff value="${esc(d.staffId||saved.id||"")}" placeholder="e.g. MGH-ENG-014"></label>
    </div>
    <p class="muted" style="font-size:13px;margin:10px 0 0">Tap Start only when you are at the basement admin offices and ready to walk the floors. Your start time is recorded.</p>
    <div class="share"><button class="primary" id="startBtn">Start ${esc(c.layer)} check</button></div>
    <div id="startErr" class="blockers" role="alert"></div>
   </div>${mode!=="db"?`<div class="notice bad">Shared saving is unavailable in this view, so entries stay on this device only.</div>`:""}`;

function renderSign(){
  const c=CK[active],d=C[active].data,s=stats(active);
  const bl=[];
  if(s.rec<s.total) bl.push(`${s.total-s.rec} areas not recorded yet`);
  if(s.missing) bl.push(`${s.missing} items ON without a reason`);
  if(s.vpend) bl.push(`${s.vpend} previous ON records not confirmed True or False`);
  if(s.vnote) bl.push(`${s.vnote} False records without what you found and did`);
  const unrecFloors=FLOORS.filter(f=>{const k=stats(active,floorIds(f));return k.rec<k.total}).map(f=>f.name);
  const fl=flags(active).filter(x=>x!=="Not signed off");
  const dis=d.signedAt?" disabled":"";
  let h=`<div class="floorhead"><h2>Sign off · ${esc(c.round)} ${esc(c.layer)}</h2><p>${d.signedAt?`Signed off at ${hm(d.signedAt)}. This check is locked.`:"Check the summary, tick the declaration and sign off."}</p></div>
   <div class="panel"><h3>Summary</h3><div class="strip" style="font-size:14px">
     <span>Recorded <span class="n">${s.rec}/${s.total}</span></span><span>Found ON <span class="n">${s.on}</span></span><span>Switched off by you <span class="n">${s.caught}</span></span><span>In use / needed <span class="n">${s.inuse}</span></span><span>Could not switch off <span class="n">${s.unres}</span></span><span>Occupied rooms <span class="n">${s.occ}</span></span>${s.ver?`<span>Previous record confirmed true <span class="n">${s.vt}</span></span><span>${CK[active].change?"Changed":"False"} <span class="n">${s.vf}</span></span>`:""}</div>
     ${unrecFloors.length&&!d.signedAt?`<p class="muted" style="font-size:13px">Floors with areas left: ${esc(unrecFloors.join(", "))}</p>`:""}
     ${fl.length?`<h4>Flags</h4><ul class="blockers" style="color:var(--on)">${fl.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
   </div>`;
  if(c.final){
    const dsc=discrepancies();
    h+=`<div class="panel"><h3>Today's false records and changes (${dsc.length})</h3>${dsc.length?discTable(dsc):`<p class="muted" style="margin:0">None. Every record was confirmed true by the next layer.</p>`}
      <h4>Duty Manager remarks and actions</h4><textarea id="dmRemarks" data-remarks rows="4" placeholder="e.g. Finance office AC left on at 19:00 and 19:30. Spoke to Finance Manager. Engineering to fit timer."${dis}>${esc(d.remarks||"")}</textarea></div>`;
  }
  h+=`<div class="panel"><h3>Declaration</h3>
    <label class="decl"><input type="checkbox" id="declBox"${d.declaration||d.signedAt?" checked":""}${dis}><span>I, <b>${esc(d.staffName)}</b> (staff ID ${esc(d.staffId)}), physically visited every area recorded in this check, switched off everything not in use, and recorded what I found truthfully.</span></label>
    ${bl.length&&!d.signedAt?`<ul class="blockers">${bl.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`:""}
    <div class="share">${d.signedAt?`<span class="pill ok">Signed ${hm(d.signedAt)}</span>${owner?`<button id="reopenBtn">Reopen check</button>`:""}`:`<button class="primary" id="signBtn"${bl.length?" disabled":""}>Sign off check</button>`}
    ${c.final&&d.signedAt?`<button class="primary" data-goview="report">Open day report</button>`:""}</div></div>`;
  main.innerHTML=h;
}
function renderCheck(){
  const d=C[active].data;

  if(floor==="SIGN"){renderSign();return}

    h+=`<section class="zone${z.priority?" priority":""}"><div class="zonehead"><div><h3>${esc(z.name)}${z.priority?'<span class="flag">PRIORITY</span>':""}</h3>${z.sub?`<span class="zn">${esc(z.sub)}</span>`:""}</div><span class="k">${k.rec}/${k.total}</span></div>`

function discTable(dsc){
  return `<div class="tw"><table class="t"><thead><tr><th>Type</th><th>Area</th><th>Floor</th><th>Previous record</th><th>Found</th><th>Reason / what was done</th></tr></thead><tbody>${

}
function onList(cid){const its=items(cid);return ORDER.filter(a=>state(a,its[a.id])==="on").map(a=>({a,it:its[a.id]}))}
function dateLabel(){return new Date(date+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function textSummary(){
  const dsc=discrepancies();
  let t=`*MGH Daily Energy Round — ${dateLabel()}*\n`;
  t+=C.dm.data.signedAt?`Day closed by Duty Manager at ${hm(C.dm.data.signedAt)}\n`:`Day report OPEN (Duty Manager not signed off)\n`;
  if(activeMeters().length){
    if(mread.data.t){t+=`\n*Meter (read ${hm(mread.data.t)} by ${mread.data.staffName}, ID ${mread.data.staffId})*`;
      meterRows().forEach(x=>{t+=`\n${x.m.number}: ${fmt(x.v)} kWh${x.units!=null?` · used since ${dshort(x.p.date)}: ${fmt(x.units)} kWh${x.days>1?` (${x.days} days)`:""}`:" · first reading"}${x.flags.length?" ⚠ "+x.flags.join(" "):""}`});t+="\n";}
    else t+=`\nMeter reading: NOT RECORDED\n`;
  }
  CHECKS.forEach(c=>{const d=C[c.id].data,s=stats(c.id);
    t+=`\n${c.short} (${c.sched}): `;
    if(!d.startedAt){t+="NOT DONE";return}
    t+=`${d.staffName} (ID ${d.staffId}), ${hm(d.startedAt)}–${d.signedAt?hm(d.signedAt):"not signed"} · ${s.rec}/${s.total} recorded · ON ${s.on} (switched off ${s.caught}, in use ${s.inuse}, not resolved ${s.unres}${s.missing?`, no reason ${s.missing}`:""})`;
    const fl=flags(c.id);if(fl.length)t+=`\n  Flags: ${fl.join("; ")}`;});
  const unres=[];CHECKS.forEach(c=>onList(c.id).forEach(x=>{if(x.it.r===R_UNRES)unres.push(`${c.short}: ${x.a.full} (${x.a.floor.name})${x.it.n?" – "+x.it.n:""}`)}));
  if(unres.length)t+=`\n\n*Could not switch off (${unres.length})*\n`+unres.slice(0,15).map(x=>"• "+x).join("\n")+(unres.length>15?`\n…and ${unres.length-15} more`:"");
  t+=`\n\n*Verification: ${dsc.filter(x=>x.type==="False").length} false, ${dsc.filter(x=>x.type==="Changed").length} changed*`;
  if(dsc.length)t+="\n"+dsc.slice(0,15).map(x=>`• ${x.type.toUpperCase()} ${x.a.full} (${x.a.floor.name}): ${CK[x.p].short} recorded ${x.pDesc}; ${CK[x.q].short} found ${descr(x.a,x.qIt)}${x.qIt.vn?" – "+x.qIt.vn:x.qIt.r&&state(x.a,x.qIt)==="on"?" – "+x.qIt.r:""}`).join("\n")+(dsc.length>15?`\n…and ${dsc.length-15} more`:"");
  if(C.dm.data.remarks)t+=`\n\n*Duty Manager remarks*\n${C.dm.data.remarks}`;
  t+=`\n\nFull PDF report attached.`;
  return t;
}

/* ================= Electricity meters ================= */
const LS2="mgh-energy-meter:";
function addDays(ds,n){const d=new Date(ds+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function dayDiff(a,b){return Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/864e5)}
function fmt(n,dp){return n==null||isNaN(n)?"—":Number(n).toLocaleString("en-US",{maximumFractionDigits:dp==null?1:dp})}
function dshort(ds){return new Date(ds+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function nextMonth(mon){const [y,m]=mon.split("-").map(Number);return m===12?(y+1)+"-01":y+"-"+p2(m+1)}
function sSet(path,data){
  if(mode!=="db"){try{localStorage.setItem(LS2+path,JSON.stringify(data))}catch(e){}setSave("Saved on this device");return}
  enqueue(path,()=>db.doc(path).set(data));
}
function lsGet(path){try{const v=localStorage.getItem(LS2+path);return v?JSON.parse(v):null}catch(e){return null}}
async function sRange(from,to){
  let out=[];
  if(mode==="db"){const q=await db.collection("meters").where("date",">=",from).where("date","<=",to).limit(500).get();out=q.docs.map(d=>d.data())}
  else{try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(LS2+"meters/")===0){const v=JSON.parse(localStorage.getItem(k));if(v&&v.date>=from&&v.date<=to)out.push(v)}}}catch(e){}}
  return out.filter(r=>r&&r.date).sort((a,b)=>a.date<b.date?-1:1);
}
function activeMeters(){return meters.filter(m=>m.active!==false)}
async function loadPrev(){
  const forDate=date;
  let rows=[];try{rows=await sRange(addDays(date,-45),addDays(date,-1))}catch(e){}
  if(forDate!==date)return;
  const pr={};
  meters.forEach(m=>{const rs=rows.filter(r=>r.readings&&r.readings[m.id]&&r.readings[m.id].value!=null);
    if(!rs.length)return;const last=rs[rs.length-1];
    const daily=[];for(let i=1;i<rs.length;i++){const dd=dayDiff(rs[i-1].date,rs[i].date);if(dd>0)daily.push((rs[i].readings[m.id].value-rs[i-1].readings[m.id].value)*(m.mult||1)/dd)}
    const l7=daily.slice(-7);
    pr[m.id]={date:last.date,value:+last.readings[m.id].value,t:last.readings[m.id].t||last.t,avg:l7.length?l7.reduce((a,b)=>a+b,0)/l7.length:null};});
  prevRead=pr;render();
}
function meterCalc(m,value){
  const p=prevRead[m.id];if(value==null||value===""||isNaN(value)||!p)return {units:null,flags:[],p};
  const days=dayDiff(p.date,date);const units=(Number(value)-p.value)*(m.mult||1);const fl=[];
  if(units<0)fl.push(`Lower than the previous reading (${fmt(p.value)}). Check the digits or note a meter change.`);
  if(days>1)fl.push(`Covers ${days} days: no reading recorded since ${dshort(p.date)}.`);
  if(p.avg&&units>=0&&units/days>p.avg*1.5)fl.push(`${Math.round(units/days/p.avg*100)}% of the 7-day average (${fmt(p.avg)} per day).`);
  return {units,days,flags:fl,p};
}
function meterRows(){return activeMeters().map(m=>{const r=mread.data.readings[m.id];const v=r&&r.value!=null?r.value:null;return Object.assign({m,v},meterCalc(m,v))})}
function meterTable(){
  const rows=meterRows();

    rows.map(x=>`<tr><td>${esc(x.m.name)}</td><td class="n">${esc(x.m.number)}</td><td class="n">${fmt(x.v)}</td><td class="n">${x.p?fmt(x.p.value)+"<br><span class='muted'>"+dshort(x.p.date)+"</span>":"—"}</td><td class="n"><b>${x.units==null?"—":fmt(x.units)+" kWh"}</b>${x.days>1?`<br><span class="muted">${x.days} days</span>`:""}</td><td style="color:var(--bad);font-size:12px">${x.flags.map(esc).join("<br>")||(x.units==null?'<span class="muted">First reading</span>':'<span style="color:var(--off)">OK</span>')}</td></tr>`).join("")}</tbody></table></div>
   <p class="muted" style="font-size:13px;margin:8px 0 0">Total used ${(()=>{const u=rows.filter(x=>x.units!=null);return u.length?`since the previous reading: <b>${fmt(u.reduce((a,x)=>a+x.units,0))} kWh</b>`:"will show from the second day of readings."})()}</p>`;
}

function updCalc(mid){

function monthCalc(mon,rows){
  const start=mon+"-01",next=nextMonth(mon)+"-01";

  const nDays=dayDiff(start,next);const byDay=Array.from({length:nDays},(_,i)=>({date:addDays(start,i),units:0,avg:false,has:false}));
  const per=ms.map(m=>{const mult=m.mult||1;
    const rs=rows.filter(r=>r.readings&&r.readings[m.id]&&r.readings[m.id].value!=null&&r.date>=start&&r.date<=next).map(r=>({date:r.date,value:+r.readings[m.id].value,by:r.staffName,sid:r.staffId,t:r.readings[m.id].t||r.t}));
    const s=rs[0]||null,e=rs.length>1?rs[rs.length-1]:null;
    const steps=[];for(let i=1;i<rs.length;i++){const a=rs[i-1],b=rs[i];const days=dayDiff(a.date,b.date);const units=(b.value-a.value)*mult;steps.push({a,b,days,units});
      for(let k=0;k<days;k++){const di=dayDiff(start,addDays(a.date,k));if(di>=0&&di<nDays){byDay[di].units+=units/days;byDay[di].has=true;if(days>1)byDay[di].avg=true}}}
    return {m,rs,s,e,steps,total:s&&e?(e.value-s.value)*mult:null,days:s&&e?dayDiff(s.date,e.date):0,fullStart:!!s&&s.date===start,fullEnd:!!e&&e.date===next};
  });
  const tot=per.reduce((a,x)=>a+(x.total||0),0);const days=Math.max(0,...per.map(x=>x.days));
  const hi=byDay.filter(d=>d.has&&!d.avg).sort((a,b)=>b.units-a.units)[0]||null;
  return {mon,start,next,per,byDay,tot,days,hi,avg:days?tot/days:null,complete:per.length>0&&per.every(x=>x.fullStart&&x.fullEnd)};
}
function monLabel(mon){return new Date(mon+"-15T12:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"})}
function chartSvg(byDay){
  const W=720,H=220,L=48,R=8,T=12,B=28,pw=W-L-R,ph=H-T-B;const mx=Math.max(0,...byDay.map(d=>d.units));
  if(!byDay.some(d=>d.has))return `<p class="muted" style="margin:0">The chart fills in once there are two days of readings.</p>`;
  const step=niceStep(mx/4),top=Math.max(step*4,step*Math.ceil(mx/step));const n=byDay.length,bw=pw/n;
  let g="";for(let v=0;v<=top+1e-9;v+=step){const y=T+ph-(v/top)*ph;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+4}" text-anchor="end">${fmt(v,0)}</text>`}
  let bars="";byDay.forEach((d,i)=>{const x=L+i*bw+1,w=Math.max(1,bw-2);const day=Number(d.date.slice(8));
    if(day===1||day%5===0)bars+=`<text class="ax" x="${x+w/2}" y="${H-8}" text-anchor="middle">${day}</text>`;
    if(!d.has||d.units<=0)return;const hgt=(d.units/top)*ph,y=T+ph-hgt,r=Math.min(4,w/2,hgt);
    bars+=`<path class="bar${d.avg?" avg":""}" d="M${x},${T+ph}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${T+ph}Z"><title>${dshort(d.date)}: ${fmt(d.units)} kWh${d.avg?" (averaged over a gap in readings)":""}</title></path>`});
  return `<div class="tw"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily electricity use, kWh">${g}${bars}</svg></div>
    <div class="legend"><span><i style="background:var(--teal)"></i>kWh used that day</span><span><i style="background:var(--teal);opacity:.4"></i>Averaged over days with no reading</span></div>`;
}
function niceStep(x){if(!(x>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}

  if(t.dataset.mread!==undefined){mdraft[t.dataset.mread]=t.value;updCalc(t.dataset.mread);return}
  if(t.dataset.vnote!==undefined&&editable()){const id=t.dataset.vnote;const it=Object.assign({},items(active)[id]||{},{vn:t.value});C[active].data.items[id]=it;
    clearTimeout(timers["v"+id]);const cid=active;timers["v"+id]=setTimeout(()=>{save(cid,{items:{[id]:C[cid].data.items[id]}});const blk=t.closest(".ver");if(blk&&t.value.trim())blk.classList.remove("missing")},700);return}
  if(t.dataset.note!==undefined&&editable()){const id=t.dataset.note;const it=Object.assign({},items(active)[id]||{},{n:t.value});C[active].data.items[id]=it;
    clearTimeout(timers[id]);const cid=active;timers[id]=setTimeout(()=>save(cid,{items:{[id]:C[cid].data.items[id]}}),700);return}
  if(t.dataset.remarks!==undefined&&editable()){C[active].data.remarks=t.value;clearTimeout(timers.rm);const cid=active;timers.rm=setTimeout(()=>save(cid,{remarks:C[cid].data.remarks}),800)}
});

/* ================= Boot ================= */
subscribe();
(async()=>{
  const cl=window.claude&&window.claude.use?window.claude:null;
  if(!cl){setSave("Saved on this device");return}
  const [d,u,dl]=await Promise.all([cl.use("db").catch(()=>null),cl.use("user").catch(()=>null),cl.use("downloads").catch(()=>null)]);
  user=u;downloads=dl;
  if(u){try{myId=await u.id();owner=await u.isOwner()}catch(_){}}
  if(d){db=d;mode="db";subscribe()}else{setSave("Saved on this device");render()}
})();
})();
</script>
