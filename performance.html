<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MGH Energy Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="/mgh-data.js"></script>
<style>
/* Layout: period switcher, KPI tiles, two bar charts, period table, compliance table. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#18221f; --muted:#5d6a66; --line:#d9ddd9;
  --teal:#1f4b47; --teal-soft:#e2ecea; --brass:#9a6b1f; --good:#2d7a4b; --bad:#b3261e; --warm:#b45d00;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111816;--panel:#19221f;--ink:#e6ebe8;--muted:#97a6a1;--line:#2c3834;--teal:#8cc4bd;--teal-soft:#1d2e2b;--brass:#d9a85a;--good:#6cc690;--bad:#f2847a;--warm:#f0a24a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111816;--panel:#19221f;--ink:#e6ebe8;--muted:#97a6a1;--line:#2c3834;--teal:#8cc4bd;--teal-soft:#1d2e2b;--brass:#d9a85a;--good:#6cc690;--bad:#f2847a;--warm:#f0a24a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--display)}
.mghnav{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:center;font:600 12px/1.2 var(--display);padding:8px max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--panel)}
.mghnav a{color:inherit;opacity:.75;text-decoration:none}.mghnav a[aria-current="page"]{opacity:1;text-decoration:underline;text-underline-offset:3px}.mghnav button{margin-left:auto;font:inherit;background:none;border:0;color:inherit;opacity:.75;cursor:pointer;padding:0}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
h1 small{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:16px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;border-left:1px solid var(--line);background:none;color:var(--ink);padding:8px 14px;cursor:pointer}
.seg button:first-child{border-left:0}.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.nav{display:flex;gap:8px;align-items:center}.nav b{font-size:15px;min-width:190px;text-align:center}
button.b{font:inherit;cursor:pointer;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
button.b:focus-visible,.seg button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile b{display:block;font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.tile small{font-size:12px;color:var(--muted)}.up{color:var(--bad)}.down{color:var(--good)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:16px}
.panel h2{margin:0 0 4px;font-size:16px}.panel p.s{margin:0 0 10px;color:var(--muted);font-size:13px}
.tw{overflow-x:auto}
svg.chart{display:block;width:100%;min-width:560px;height:auto}
svg .ax{fill:var(--muted);font:11px var(--mono)} svg .gl{stroke:var(--line)} svg .m{fill:var(--teal)} svg .m:hover{opacity:.75} svg .m.avg{opacity:.4}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}td:first-child{font-family:var(--display)}
tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.pct{display:inline-block;min-width:44px;padding:1px 6px;border-radius:999px;font-size:11px;font-weight:700;text-align:center}
.pct.g{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}.pct.w{background:color-mix(in srgb,var(--warm) 16%,transparent);color:var(--warm)}.pct.r{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.muted{color:var(--muted)} .note{font-size:12px;color:var(--muted);margin-top:8px}
@media print{.mghnav,.bar .seg,.nav button,#csvBtn,#printBtn{display:none}.panel,.tile{break-inside:avoid}}
</style>
</head>
<body>
<nav class="mghnav"><a href="/">MGH Energy Control</a><a href="/energy-round">Energy round</a><a href="/ac-control">AC control</a><a href="/performance" aria-current="page">Performance</a><button type="button" onclick="MGH.changePin()">Change PIN</button></nav>
<main class="wrap">
  <h1><small>Manhattan Grand Hotel · Energy Control</small>Energy performance</h1>
  <div class="bar">
    <div class="seg" role="group" aria-label="Period"><button data-p="week" aria-pressed="false">Week</button><button data-p="month" aria-pressed="true">Month</button><button data-p="year" aria-pressed="false">Year</button></div>
    <div class="nav"><button class="b" id="prev" aria-label="Previous period">←</button><b id="label">…</b><button class="b" id="next" aria-label="Next period">→</button></div>
    <div style="display:flex;gap:8px"><button class="b" id="csvBtn">Download CSV</button><button class="b" id="printBtn">Print / PDF</button></div>
  </div>
  <div id="out"><p class="muted">Loading…</p></div>
</main>
<script>
(function(){
const STD_CHECKS=[["meter","Meter reading","08:00"],["r1-eng","R1 Engineering","12:00"],["r1-sec","R1 Security","12:30"],["r2-eng","R2 Engineering","19:00"],["r2-sec","R2 Security","19:30"],["dm","Duty Manager","23:30"],["ac-tech","AC technician","09:00"],["ac-ce","Chief Engineer (AC)","18:30"]];
let period="month",anchor=today(),db=null,rows=null;
const $=s=>document.querySelector(s);
function p2(n){return String(n).padStart(2,"0")}
function today(){const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function add(ds,n){const d=new Date(ds+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function diff(a,b){return Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/864e5)}
function fmt(n,dp){return n==null||isNaN(n)?"—":Number(n).toLocaleString("en-US",{maximumFractionDigits:dp==null?0:dp})}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function dlabel(ds,o){return new Date(ds+"T12:00:00").toLocaleDateString("en-GB",o||{day:"numeric",month:"short"})}
function range(p,a){
  if(p==="week"){const dow=new Date(a+"T12:00:00Z").getUTCDay();const s=add(a,-((dow+6)%7));return {start:s,end:add(s,6)}}
  if(p==="month"){const s=a.slice(0,7)+"-01";const n=s.slice(5,7)==="12"?(+s.slice(0,4)+1)+"-01-01":s.slice(0,4)+"-"+p2(+s.slice(5,7)+1)+"-01";return {start:s,end:add(n,-1)}}
  return {start:a.slice(0,4)+"-01-01",end:a.slice(0,4)+"-12-31"};
}
function shift(p,a,dir){if(p==="week")return add(a,7*dir);if(p==="month"){const y=+a.slice(0,4),m=+a.slice(5,7)+dir;const d=new Date(Date.UTC(y,m-1,1));return d.toISOString().slice(0,10)}return (+a.slice(0,4)+dir)+"-01-01"}
function label(p,r){if(p==="week")return `${dlabel(r.start)} – ${dlabel(r.end,{day:"numeric",month:"short",year:"numeric"})}`;if(p==="month")return dlabel(r.start,{month:"long",year:"numeric"});return r.start.slice(0,4)}
async function q(coll,from,to){const s=await db.collection(coll).where("date",">=",from).where("date","<=",to).limit(1000).get();return s.docs.map(d=>d.data()).filter(x=>x&&x.date)}

// kWh per usage day: a reading on day d closes day d-1. Gaps are spread evenly.
function kwhByDay(meterDocs,meters,from,to){
  const out={};const mult={};meters.forEach(m=>mult[m.id]=m.mult||1);
  const ids=new Set();meterDocs.forEach(r=>Object.keys(r.readings||{}).forEach(k=>ids.add(k)));
  ids.forEach(mid=>{const rs=meterDocs.filter(r=>r.readings&&r.readings[mid]&&r.readings[mid].value!=null).sort((a,b)=>a.date<b.date?-1:1);
    for(let i=1;i<rs.length;i++){const a=rs[i-1],b=rs[i];const n=diff(a.date,b.date);if(n<=0)continue;const u=(b.readings[mid].value-a.readings[mid].value)*(mult[mid]||1);if(u<0)continue;
      for(let k=0;k<n;k++){const d=add(a.date,k);if(d>=from&&d<=to){out[d]=out[d]||{u:0,avg:false};out[d].u+=u/n;if(n>1)out[d].avg=true}}}});
  return out;
}
function buckets(p,r){const b=[];if(p==="year"){for(let m=1;m<=12;m++){const s=r.start.slice(0,4)+"-"+p2(m)+"-01";b.push({key:s.slice(0,7),label:dlabel(s,{month:"short"}),from:s,to:range("month",s).end})}}
  else{for(let d=r.start;d<=r.end;d=add(d,1))b.push({key:d,label:p==="week"?dlabel(d,{weekday:"short",day:"numeric"}):String(+d.slice(8)),from:d,to:d})}return b}

async function load(){
  const r=range(period,anchor);const pr=range(period,shift(period,anchor,-1));
  $("#label").textContent=label(period,r);$("#out").innerHTML='<p class="muted">Loading…</p>';
  const key=period+anchor;
  try{
    const [days,acdays,mdocs,cfg]=await Promise.all([q("days",r.start,r.end),q("acdays",r.start,r.end),q("meters",add(pr.start,-31),add(r.end,1)),db.doc("config/meters").get()]);
    if(key!==period+anchor)return;
    const meters=(cfg.exists&&cfg.data().list)||[];
    const kw=kwhByDay(mdocs,meters,pr.start,r.end);
    render(r,pr,days,acdays,mdocs,kw);
  }catch(e){$("#out").innerHTML=`<p style="color:var(--bad)">Could not load the data (${esc(e.message||e.code||"error")}). Check the connection and the PIN.</p>`}
}
function sumK(kw,f,t){let s=0,n=0;for(let d=f;d<=t;d=add(d,1)){if(kw[d]){s+=kw[d].u;n++}}return {s,n}}
function render(r,pr,days,acdays,mdocs,kw){
  const t=today();const lastDay=r.end<t?r.end:add(t,0);const elapsed=r.start>t?0:diff(r.start,lastDay)+1;
  const D={};days.forEach(d=>D[d.date]=d);const A={};acdays.forEach(d=>A[d.date]=d);const M={};mdocs.forEach(d=>M[d.date]=d);
  const cur=sumK(kw,r.start,r.end),prev=sumK(kw,pr.start,pr.end);
  const avg=cur.n?cur.s/cur.n:null,pavg=prev.n?prev.s/prev.n:null;const ch=avg&&pavg?(avg-pavg)/pavg*100:null;
  // per-bucket metrics
  const B=buckets(period,r).map(b=>{const o={...b,kwh:0,kn:0,avg:false,on:0,caught:0,unres:0,fals:0,changed:0,acReset:0,acDev:0,hot:0,daysLogged:0};
    for(let d=b.from;d<=b.to;d=add(d,1)){if(kw[d]){o.kwh+=kw[d].u;o.kn++;if(kw[d].avg)o.avg=true}
      const x=D[d];if(x){o.daysLogged++;Object.values(x.summary||{}).forEach(s=>{o.on+=s.on||0;o.caught+=s.caught||0;o.unres+=s.unres||0});o.fals+=x.falseCount!=null?x.falseCount:(x.discrepancies||0);o.changed+=x.changed||0}
      const a=A[d];if(a){o.acReset+=a.reset||0;o.acDev+=a.dev||0;o.hot+=a.hotMin||0}}
    return o});
  const T=B.reduce((t,o)=>{["on","caught","unres","fals","changed","acReset","acDev","hot"].forEach(k=>t[k]+=o[k]);return t},{on:0,caught:0,unres:0,fals:0,changed:0,acReset:0,acDev:0,hot:0});
  // compliance
  const comp=STD_CHECKS.map(([id,name,sched])=>{let done=0,signed=0,late=0;
    for(let i=0;i<elapsed;i++){const d=add(r.start,i);const sch=new Date(d+"T"+sched+":00").getTime();
      if(id==="meter"){const m=M[d];if(m&&m.t){done++;signed++;if(m.t-sch>30*60000)late++}}
      else if(id==="ac-tech"){const a=A[d];if(a&&a.techStartedAt){done++;if(a.techSignedAt)signed++;if(a.techStartedAt-sch>45*60000)late++}}
      else if(id==="ac-ce"){const a=A[d];if(a&&a.ceSignedAt){done++;signed++;if(a.ceSignedAt-sch>60*60000)late++}}
      else{const s=D[d]&&D[d].summary&&D[d].summary[id];if(s&&s.startedAt){done++;if(s.signedAt)signed++;if(s.startedAt-sch>30*60000)late++}}}
    return {name,sched,done,signed,late}});
  const totalDue=elapsed*STD_CHECKS.length,totalSigned=comp.reduce((a,c)=>a+c.signed,0);
  const pct=(a,b)=>b?Math.round(a/b*100):null;const pc=v=>v==null?"—":`<span class="pct ${v>=95?"g":v>=80?"w":"r"}">${v}%</span>`;
  const hrs=m=>`${Math.floor(m/60)} h ${Math.round(m%60)} m`;
  $("#out").innerHTML=`
   <div class="tiles">
    <div class="tile"><span>Electricity used</span><b>${fmt(cur.s)}</b><small>kWh · ${cur.n} of ${diff(r.start,r.end)+1} days metered</small></div>
    <div class="tile"><span>Average per day</span><b>${fmt(avg)}</b><small>${ch==null?"kWh":`kWh · <span class="${ch>0?"up":"down"}">${ch>0?"▲":"▼"} ${fmt(Math.abs(ch),1)}%</span> vs previous`}</small></div>
    <div class="tile"><span>Checks signed off</span><b>${pct(totalSigned,totalDue)==null?"—":pct(totalSigned,totalDue)+"%"}</b><small>${totalSigned} of ${totalDue} due so far</small></div>
    <div class="tile"><span>Switched off by checkers</span><b>${fmt(T.caught)}</b><small>lights / AC found left on</small></div>
    <div class="tile"><span>False records</span><b>${fmt(T.fals)}</b><small>caught by the next layer</small></div>
    <div class="tile"><span>AC reset to 23°C</span><b>${fmt(T.acReset)}</b><small>lobby ${hrs(T.hot)} at 19°C</small></div>
   </div>
   <div class="panel"><h2>Electricity used</h2><p class="s">kWh per ${period==="year"?"month":"day"}, from the start-of-day meter readings. Faded bars are averaged over days with no reading.</p>${chart(B.map(o=>({l:o.label,v:o.kn?o.kwh:null,avg:o.avg})),"kWh")}</div>
   <div class="panel"><h2>Lights and AC switched off by checkers</h2><p class="s">Items found left on with nobody using them, per ${period==="year"?"month":"day"}. Lower is better.</p>${chart(B.map(o=>({l:o.label,v:o.daysLogged?o.caught:null})),"items",true)}</div>
   <div class="panel"><h2>${period==="year"?"By month":"By day"}</h2><div class="tw"><table><thead><tr><th>${period==="year"?"Month":"Day"}</th><th>kWh</th><th>Found ON</th><th>Switched off</th><th>Not resolved</th><th>False</th><th>Changed</th><th>AC reset</th><th>AC not 23°C</th><th>Lobby 19°C</th></tr></thead><tbody>${
     B.map(o=>`<tr><td>${esc(period==="year"?o.label:dlabel(o.from,{weekday:"short",day:"numeric",month:"short"}))}</td><td>${o.kn?fmt(o.kwh):"—"}</td><td>${o.daysLogged?o.on:"—"}</td><td>${o.daysLogged?o.caught:"—"}</td><td>${o.daysLogged?o.unres:"—"}</td><td>${o.daysLogged?o.fals:"—"}</td><td>${o.daysLogged?o.changed:"—"}</td><td>${o.acReset||"—"}</td><td>${o.acDev||"—"}</td><td>${o.hot?hrs(o.hot):"—"}</td></tr>`).join("")}</tbody>
     <tfoot><tr><td>Total</td><td>${fmt(cur.s)}</td><td>${T.on}</td><td>${T.caught}</td><td>${T.unres}</td><td>${T.fals}</td><td>${T.changed}</td><td>${T.acReset}</td><td>${T.acDev}</td><td>${hrs(T.hot)}</td></tr></tfoot></table></div></div>
   <div class="panel"><h2>Check compliance</h2><p class="s">${elapsed} day${elapsed===1?"":"s"} so far in this period. Late = started more than 30 minutes after schedule (AC technician 45, Chief Engineer 60).</p><div class="tw"><table><thead><tr><th>Check</th><th>Time</th><th>Done</th><th>Signed off</th><th>Started late</th><th>Signed rate</th></tr></thead><tbody>${
     comp.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.sched}</td><td>${c.done}/${elapsed}</td><td>${c.signed}/${elapsed}</td><td>${c.late}</td><td>${pc(pct(c.signed,elapsed))}</td></tr>`).join("")}</tbody></table></div>
     <p class="note">Energy round counts come from each day's summary, saved as checks are recorded. Electricity totals need a meter reading every morning.</p></div>`;
  rows={B,period,label:$("#label").textContent};
}
function chart(data,unit,integer){
  if(!data.some(d=>d.v!=null&&d.v>0))return '<p class="muted" style="margin:0">No data in this period yet.</p>';
  const W=760,H=230,L=52,R=8,T=12,Bm=30,pw=W-L-R,ph=H-T-Bm;const mx=Math.max(...data.map(d=>d.v||0));
  const st=integer?Math.max(1,nice(mx/4)):nice(mx/4),top=Math.max(st*4,Math.ceil(mx/st)*st);const n=data.length,bw=pw/n;let g="",m="";
  for(let v=0;v<=top+1e-9;v+=st){const y=T+ph-(v/top)*ph;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}
  const every=n>16?5:1;
  data.forEach((d,i)=>{const x=L+i*bw+1,w=Math.max(1,bw-2);if(i%every===0||n<=16)m+=`<text class="ax" x="${x+w/2}" y="${H-10}" text-anchor="middle">${esc(d.l)}</text>`;
    if(d.v==null||d.v<=0)return;const h=d.v/top*ph,y=T+ph-h,rr=Math.min(4,w/2,h);
    m+=`<path class="m${d.avg?" avg":""}" d="M${x},${T+ph}V${y+rr}Q${x},${y} ${x+rr},${y}H${x+w-rr}Q${x+w},${y} ${x+w},${y+rr}V${T+ph}Z"><title>${esc(d.l)}: ${fmt(d.v,1)} ${unit}</title></path>`});
  return `<div class="tw"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)} per period">${g}${m}</svg></div>`;
}
function nice(x){if(!(x>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.p){period=b.dataset.p;document.querySelectorAll("[data-p]").forEach(x=>x.setAttribute("aria-pressed",x===b));load()}
  if(b.id==="prev"){anchor=shift(period,anchor,-1);load()} if(b.id==="next"){anchor=shift(period,anchor,1);load()}
  if(b.id==="printBtn")window.print();
  if(b.id==="csvBtn"&&rows){const h=["Period","kWh","Found ON","Switched off","Not resolved","False","Changed","AC reset","AC not 23C","Lobby 19C minutes"];
    const lines=[h.join(",")].concat(rows.B.map(o=>[o.key,o.kn?o.kwh.toFixed(1):"",o.on,o.caught,o.unres,o.fals,o.changed,o.acReset,o.acDev,Math.round(o.hot)].join(",")));
    const blob=new Blob([lines.join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`MGH-Energy-Performance-${rows.B[0].key}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000)}
});
(async()=>{db=await window.claude.use("db");load()})();
})();
</script>
</body>
</html>
